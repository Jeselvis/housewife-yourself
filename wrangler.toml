name = "realyouwives"
main = "worker.js"
compatibility_date = "2026-11-06"

[assets]
directory = "./app/dist"

[[kv_namespaces]]
binding    = "EVAL_STORE"
id         = "44a79509c4d742a48eaa6688a686efbb"   # production namespace id
preview_id = "339e19245cef41bf8c48b5364a4d3c7c"   # preview namespace id

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false